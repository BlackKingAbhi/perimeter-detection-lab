# /etc/nginx/conf.d/security-headers.conf
# Small, beginner-friendly hardening. Apply with: sudo nginx -t && sudo systemctl reload nginx

# Do not reveal the exact Nginx version in error pages and the "Server" header.
server_tokens off;

# Stop other sites from showing this page inside a frame (clickjacking protection).
add_header X-Frame-Options "SAMEORIGIN" always;

# Stop browsers from guessing ("sniffing") a different content type.
add_header X-Content-Type-Options "nosniff" always;

# Send only the origin (not the full URL) when users follow links to other sites.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
