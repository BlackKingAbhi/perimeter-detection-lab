# /etc/ssh/sshd_config.d/99-lab-hardening.conf
# Apply AFTER the failed-login tests are finished.
#
# !! Set up key-based login FIRST, or you will lock yourself out !!
#   On your laptop (PowerShell):  ssh-keygen -t ed25519
#   Copy the contents of %USERPROFILE%\.ssh\id_ed25519.pub into web01's
#   /home/admin01/.ssh/authorized_keys  (permissions: ~/.ssh 700, authorized_keys 600)
#   Test: ssh admin01@10.10.20.10  -> logs in without asking for a password.
#
# Then copy this file into place and check it:
#   sudo cp 99-lab-hardening.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t                     # syntax check; no output means OK
#   sudo systemctl restart ssh
# Keep your current SSH session open and test from a NEW window before logging out.

PasswordAuthentication no        # only SSH keys are accepted
KbdInteractiveAuthentication no  # disable the other password-style login method
PermitRootLogin no               # nobody logs in directly as root
MaxAuthTries 3                   # disconnect after 3 failed attempts per connection
LoginGraceTime 30                # 30 seconds to finish logging in
AllowUsers admin01               # only this account may log in over SSH
